services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  sink:
    build:
      context: ./sink-ts
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  producer:
    build:
      context: ./producer
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - SINK_URL=http://sink:3000
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      sink:
        condition: service_started

  consumer:
    build:
      context: ./consumer
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - SINK_URL=http://sink:3000
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      sink:
        condition: service_started

volumes:
  redis-data:
